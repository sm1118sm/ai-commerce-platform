services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stylepick}
      MYSQL_USER: ${MYSQL_USER:-stylepick}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stylepick_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-stylepick_root_dev_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${MYSQL_USER:-stylepick}",
          "-p${MYSQL_PASSWORD:-stylepick_dev_password}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL:-mysql://${MYSQL_USER:-stylepick}:${MYSQL_PASSWORD:-stylepick_dev_password}@mysql:3306/${MYSQL_DATABASE:-stylepick}}
      DEMO_MODE: "true"
      RECOMMENDER_BACKEND: cnn
    ports:
      - "8501:8501"
    depends_on:
      mysql:
        condition: service_healthy

  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
