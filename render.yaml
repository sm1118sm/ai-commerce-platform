services:
  - type: web
    name: stylepick-ai
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stylepick-postgres
          property: connectionString

databases:
  - name: stylepick-postgres
    plan: free
    databaseName: stylepick
    user: stylepick
