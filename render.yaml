services:
  - type: web
    name: stylepick-ai
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RECOMMENDER_BACKEND
        value: cnn
