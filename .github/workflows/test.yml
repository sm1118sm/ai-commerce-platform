name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: stylepick_test
          MYSQL_USER: stylepick
          MYSQL_PASSWORD: stylepick_test_password
          MYSQL_ROOT_PASSWORD: stylepick_root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ustylepick
          -pstylepick_test_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stylepick_test
          POSTGRES_USER: stylepick
          POSTGRES_PASSWORD: stylepick_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U stylepick -d stylepick_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      STYLEPICK_TEST_DATABASE_URL: mysql://stylepick:stylepick_test_password@127.0.0.1:3306/stylepick_test

    steps:
      - uses: actions/checkout@v4
      - name: Validate portable Docker Compose setup
        run: docker compose config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: >-
          python -m pip install torch
          --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - name: Test MySQL backend
        run: python -m unittest discover -s tests -v
      - name: Enforce two-second button response budget
        run: python scripts/measure_button_latency.py
      - name: Test PostgreSQL backend
        env:
          STYLEPICK_TEST_DATABASE_URL: postgresql://stylepick:stylepick_test_password@127.0.0.1:5432/stylepick_test
        run: python -m unittest discover -s tests -v
